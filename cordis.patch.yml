# dsh-academic-skills bundle patch: mounts the academic-review plugin into
# the host composition of a dsh profile. The plugin registers the
# `academic-paper-reviewer` skill provider on the shared `skills` registry and
# the five `academic_review_*` tools on the shared `tools` registry, so every
# session of the profile can open a peer-review run through natural language.
#
# Install: `dsh plugin --profile <name> add <this package or a local path>`.
# The `dsh plugin` command installs the package into the profile and reconciles
# it into the profile's `dsh.profile.bundles` layer list.
- insert:
    - id: academic-review
      # Node-resolvable package name - must stay in sync with package.json
      # `name`.
      name: dsh-academic-skills
      config:
        # Review state lives under <session workspace>/<stateDir>/<review_id>/
        # (state.json + seats/<seat_id>.json + generated report documents).
        stateDir: .academic-review
        # Provider name on the skill registry; the skill itself keeps its
        # upstream name, academic-paper-reviewer.
        skillProviderName: academic-review
        # Manuscripts above this size get a sectioned-reading warning instead of
        # silent truncation.
        maxPaperBytes: 1048576
