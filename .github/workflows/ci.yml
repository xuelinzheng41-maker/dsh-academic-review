name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Runs on both operating systems on purpose: the harness mounts the plugin
      # and asserts the HTTP routes, so it is what catches host-semantics
      # regressions - a Windows-only green would hide Linux path and line-ending
      # failures, which is the exact defect class this pipeline was built for.
      - name: E2E harness
        run: pnpm test:e2e

      - name: Verify vendored upstream
        run: pnpm verify:vendor

      - name: Build
        run: pnpm build

  # Guards what we actually publish. Every row above runs against the working tree,
  # which cannot see the tarball at all: a files entry or an .npmignore can drop
  # vendor/, lib/ or a SKILL.md and every test still passes, because the tests read
  # the tree and not the package. One ubuntu runner is enough - packing is
  # platform-independent, and the risk being guarded is the tarball's CONTENTS.
  package:
    name: Pack and smoke-install (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke script asserts on lib/, so the build has to happen first.
      - name: Build
        run: pnpm build

      - name: Pack, install and verify the shipped tarball
        # Deliberately unmasked: a tarball that cannot install, or that installs
        # without the vendored tree, is a release blocker.
        run: node scripts/pack-smoke.mjs
