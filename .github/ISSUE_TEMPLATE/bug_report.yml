name: Bug report
description: Something in dsh-academic-skills is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This is an unofficial DSH port of the ARS
        `academic-paper-reviewer` skill — please do not report port bugs upstream,
        and do not paste manuscript text you are not allowed to share.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behaviour, in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal numbers of steps. Redact manuscript content.
      placeholder: |
        1. Open the review panel with ...
        2. Run the reviewer seat ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `package.json` or the installed plugin entry.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DSH host version
      description: DeepSeek Harness version you are running the plugin in.
      placeholder: 0.2.1-rc.2
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.19.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Console output, stack traces or the failing command result.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues before opening this one.
          required: true
        - label: This is not a security report (security reports go to the address in SECURITY/MAINTENANCE docs).
          required: true
